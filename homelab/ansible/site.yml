################################################################################
# PLAY 1: Configure Lab Router (Raspberry Pi)
################################################################################
# The lab router is the network foundation for the entire homelab. It provides:
#   - Network isolation: lab runs on its own subnet (10.42.0.0/20), fully
#     separated from the home network (192.168.2.0/24)
#   - DHCP: automatically assigns IP addresses to lab devices
#   - DNS: resolves domain names for lab devices (local + internet)
#   - NAT: allows lab devices to access the internet through the ISP modem
#   - Firewall: blocks lab → home network traffic for security
#
# The router is a Raspberry Pi with two Ethernet interfaces:
#   - eth0 (WAN): connected to the ISP modem, gets IP via DHCP
#   - eth1 (LAN): connected to the lab switch, static IP 10.42.0.1
#
# Prerequisites before running this play:
#   - Raspberry Pi OS Lite (64-bit) flashed and booted
#   - SSH enabled and key-based auth configured
#   - eth0 connected to ISP modem, eth1 (USB adapter) connected to lab switch
#   - ansibleremote user created (by the Bootstrap OS Users play above)
#
# Run: ansible-playbook site.yml --tags router
################################################################################
- name: Configure Lab Router (Raspberry Pi)
  hosts: router
  become: true
  gather_facts: true
  remote_user: ansibleremote
  tags:
    - router
  roles:
    - role: router
  post_tasks:
    - name: Display router information
      ansible.builtin.debug:
        msg:
          - "Lab router configuration completed successfully"
          - "WAN interface ({{ router_wan_interface }}): connected to ISP modem"
          - "LAN interface ({{ router_lan_interface }}): serving lab network at {{ router_lan_ip }}/{{ router_lan_cidr }}"
          - "DHCP range: {{ router_dhcp_range_start }} - {{ router_dhcp_range_end }}"
          - "Lab devices can now get IPs and reach the internet through this router"


