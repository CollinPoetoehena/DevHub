################################################################################
# TransacFlow Infrastructure Playbook (Remote/Production & DTA Environments)
# See /docs/design/Environments.md for details on different environments
# local.yml sets up local development environment
################################################################################
# This is the main playbook for configuring the TransacFlow Kubernetes cluster
# infrastructure on Azure. It orchestrates the deployment of:
#   - Jump host (bastion) for secure cluster access
#   - Management VM with all tooling (kubectl, helm, az cli, ansible, etc.)
#   - Kubernetes control plane nodes using Kubeadm
#   - Kubernetes worker nodes
#   - Container runtime (containerd/CRI-O)
#   - CNI networking plugin (Calico/Cilium/Flannel)
#
# See README.md for detailed instructions on running this playbook and the role of each component.
#
################################################################################

################################################################################
# PLAY 0: Bootstrap OS Users (run once after initial VM provisioning)
################################################################################
# TODO: this needs to be changed to just normal, NOT Azure specific anymore. It should create these users on all.
# Azure provisions VMs with a default user (azureuser). These plays use that
# account for the very first connection to create the dedicated Ansible service
# account (ansibleremote) and any personal accounts on all hosts.
#
# Run once at initial setup (before anything else):
#   ansible-playbook site.yml --tags users -u azureuser
#
# WHY a separate bootstrap play with remote_user: azureuser?
#   After terraform apply the only available SSH identity is azureuser.
#   Once these plays complete, ansibleremote exists on every host and all
#   subsequent plays connect as ansibleremote (set explicitly per play and
#   as the default in ansible.cfg).
#
# WHY ansibleremote? See group_vars/all/users.yml for the full explanation.
################################################################################

# TODO: add mgmtvm to the inventory (hosts file) once it is provisioned via terraform.
- name: Bootstrap OS users on all VMs
  hosts: all # Apply to all hosts to ensure ansibleremote (and optional other users per host) are created everywhere for consistent access in future plays.
  become: true
  gather_facts: false
  # azureuser is the Azure-provisioned default; only needed for this first run.
  # After this play, ansibleremote is available and used for all subsequent plays.
  remote_user: azureuser
  tags:
    - users
  # Use the users role to create and configure the users and groups
  # User definitions (vars input for the users role) live in group_vars — no vars block needed here:
  #   group_vars/all/users.yml: applied to every host
  #   group_vars/mgmtvm/users.yml — overrides specific for mgmtvm
  roles:
    - role: users
  post_tasks:
    - name: Confirm users are bootstrapped
      ansible.builtin.debug:
        msg: "Users bootstrapped on {{ inventory_hostname }} — future runs no longer need -u azureuser"

