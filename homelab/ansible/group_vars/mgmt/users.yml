---
# Shared user config for all management hosts (router, mgmtvm, etc.) — merged with group_vars/all/users.yml at runtime.
# Applied via the [mgmt:children] group in the inventory — any host in the mgmt group inherits these variables automatically.

# NOTE: no override of ssh_private_keys_ansibleremote by default here for all mgmt hosts, since NOT all mgmt hosts need 
# outbound SSH access to other VMs (e.g. the router does not need it, but the mgmtvm does). The mgmtvm overrides it in 
# group_vars/mgmtvm/users.yml to deploy the private key for ansibleremote so it can SSH outbound to cluster/workload VMs (e.g. mgmtvm → cluster nodes).

# Extra users specific to mgmt — appended to _users_list_base from group_vars/all/users.yml at runtime.
# In practice, a team of people/administrators need access to the mgmt hosts (e.g. a mgmtvm or the router, etc.), each with their 
# own account and SSH key, etc., and this setup below illustrates that is possible by just adding more entries to the list here.
_users_list_extra:
  # Personal admin account — sudo inherited from as-admin group, so no redundant per-user sudoers file is created (see role/users role README).
  - username: poetoec
    desc: "Collin Poetoehena"
    group: as-admin
    use_sudo: true
    ssh_public_keys:
      # Store the actual key src in vault.yml as vault_ssh_public_key_src_poetoec.
      - src: "{{ vault_ssh_public_key_src_poetoec }}"
        comment: "poetoec personal key"
  # NOTE: could potentially add more users here later if needed, such as if more administrators need access to the mgmtvm, etc.