---
# =============================================================================
# Local Environment Setup Playbook
# =============================================================================
# Run this playbook once after cloning the repository to set up the local
# development environment for Ansible. It configures everything needed on
# your laptop (the Ansible controller) before you can run playbooks against
# remote hosts.
#
# This playbook automates the full local setup process, without having to manually perform
# these steps. In previous projects, I used Bash scripts, however, Ansible is much more powerful
# and flexible for this purpose. Therefore, this playbook is written in Ansible.
#
# PLACEMENT: This playbook lives at the root of the ansible/ directory (alongside site.yml)
# because it IS a playbook — not a shell script or utility. Ansible convention is to keep all
# playbooks at the project root. site.yml targets remote infrastructure; this playbook targets
# localhost. Having both at the same level makes them equally discoverable and avoids awkward
# ../ path prefixes that would be needed if it lived in a subdirectory like scripts/.
#
# VARIABLES: Configuration is separated into vars/setup_local_env.yml so that this playbook
# defines the logic (what to do) while the vars file defines the data (what values to use).
# This separation means:
#   - Adding hosts or secrets requires only editing the vars file, not the playbook
#   - The playbook logic can be reused across different setups without modification
#   - All configurable values live in one easy-to-find, well-documented place
#   - The playbook is extensible: as the homelab grows, just add entries to the vars file
# See vars/setup_local_env.yml for full documentation on each variable.
#
# What it does (in order):
#   1. Validates prerequisites (required tools are installed)
#   2. Installs Ansible Galaxy roles from requirements.yml
#   3. Generates the Ansible inventory (hosts) file from a template
#   4. Creates the Ansible Vault password file (vars/setup_local_env.yml/vault_pass_file)
#   5. Creates and encrypts the Ansible Vault secrets file (vars/setup_local_env.yml/vault_file)
#
# Usage (from the homelab/ansible/ directory):
#   cd homelab/ansible
#   source venv/bin/activate
#   ansible-playbook setup_local_env.yml
#
# Safe to re-run: all steps check for existing files/state and skip if already configured (idempotent).
# =============================================================================

- name: Set up local Ansible environment
  hosts: localhost # Run on localhost because this playbook configures the local environment (not remote hosts)
  connection: local # Use local connection to run tasks on the controller machine (localhost)
  gather_facts: false

  # All configuration (paths, inventory hosts, vault variables) is loaded from
  # the vars file. Edit vars/setup_local_env.yml to change IPs, add hosts, etc.
  vars_files:
    - vars/setup_local_env.yml

  # Vars_prompt is used to prompt for the vault password if the vault file does not exist yet. The password is stored in a
  # temporary variable and written to the vault password file (see vars.vault_pass_file) for future use.
  vars_prompt:
    # Only used when vault files don't exist yet (tasks check before using).
    # ansible-playbook always shows vars_prompt, but the tasks skip if files exist.
    - name: vault_password
      prompt: "Enter Ansible Vault password (leave empty if vault already exists)"
      private: true # Hide input for security
      default: ""

  tasks:
    # =========================================================================
    # PART 1 — Prerequisites
    # =========================================================================
    - name: "PREREQUISITES | Check that ansible-vault is available"
      ansible.builtin.command:
        cmd: which ansible-vault
      register: ansible_vault_check
      changed_when: false # Do not mark as changed — just checking for existence
      failed_when: ansible_vault_check.rc != 0

    - name: "PREREQUISITES | Check that ansible-galaxy is available"
      ansible.builtin.command:
        cmd: which ansible-galaxy
      register: ansible_galaxy_check
      changed_when: false # Do not mark as changed — just checking for existence
      failed_when: ansible_galaxy_check.rc != 0

    # =========================================================================
    # PART 2 — Install Ansible Galaxy Roles
    # =========================================================================
    # Installs external roles defined in requirements.yml (e.g. devhub.users, devhub.jumphost).
    # These are pulled from Git repositories and placed in the roles/ directory.
    # No --force: skips roles that are already installed at the correct version.
    - name: "GALAXY ROLES | Install roles from requirements.yml"
      ansible.builtin.command:
        cmd: "ansible-galaxy install -r {{ requirements_file }}"
      register: galaxy_result
      changed_when: "'was installed successfully' in galaxy_result.stdout"

    - name: "GALAXY ROLES | Show install output"
      ansible.builtin.debug:
        var: galaxy_result.stdout_lines

    # =========================================================================
    # PART 3 — Generate Ansible Inventory (hosts file)
    # =========================================================================
    # Renders templates/hosts.j2 using the inventory_hosts variable from vars/setup_local_env.yml.
    # See the template above for details on what is loaded.
    # If the inventory file already exists, it is overwritten with the new version.
    # If no changes are detected, Ansible will report "ok" instead of "changed".
    - name: "INVENTORY | Generate hosts file from template"
      ansible.builtin.template:
        src: "{{ inventory_template }}"
        dest: "{{ inventory_file }}"
        mode: "0644"

    - name: "INVENTORY | Hosts file ready"
      ansible.builtin.debug:
        msg: "Generated: {{ inventory_file }}"

    # =========================================================================
    # PART 4 — Ansible Vault Password File
    # =========================================================================
    # The vault password file is stored outside the repository (vars/setup_local_env.yml/vault_pass_file)
    # so it is never accidentally committed to Git. It is referenced by
    # ansible-playbook via --vault-password-file or in ansible.cfg.
    - name: "VAULT | Check if vault password file exists"
      ansible.builtin.stat:
        path: "{{ vault_pass_file }}"
      register: vault_pass_stat

    - name: "VAULT | Validate vault password was provided"
      ansible.builtin.fail:
        msg: >
          Vault password file does not exist and no password was provided.
          Re-run the playbook and enter a vault password when prompted.
      when:
        - not vault_pass_stat.stat.exists
        - vault_password | length == 0

    - name: "VAULT | Create vault password file"
      ansible.builtin.copy:
        content: "{{ vault_password }}"
        dest: "{{ vault_pass_file }}"
        mode: "0600"
      when: not vault_pass_stat.stat.exists
      no_log: true # Hide in logs for security

    - name: "VAULT | Vault password file ready"
      ansible.builtin.debug:
        msg: "{{ 'Created: ' ~ vault_pass_file if not vault_pass_stat.stat.exists else 'Already exists: ' ~ vault_pass_file }}"

    # =========================================================================
    # PART 5 — Ansible Vault Secrets File
    # =========================================================================
    # Keeps the vault file in sync with vault_variables from the vars file:
    #   - First run: prompts for all variables and creates the vault
    #   - New variable added to vault_variables: prompts only for the new one
    #   - Variable removed from vault_variables: removed from the vault
    #   - No changes: vault is left untouched
    - name: "VAULT | Check if vault secrets file exists"
      ansible.builtin.stat:
        path: "{{ vault_file }}"
      register: vault_file_stat

    - name: "VAULT | Decrypt existing vault"
      ansible.builtin.command:
        cmd: "ansible-vault view {{ vault_file }} --vault-password-file {{ vault_pass_file }}"
      register: existing_vault_raw
      when: vault_file_stat.stat.exists
      no_log: true
      changed_when: false

    - name: "VAULT | Parse existing vault variables"
      ansible.builtin.set_fact:
        # "or {}" is necessary to avoid the following error when the vault has no vars/content: "object of type 'NoneType' has no attribute 'keys'"
        existing_vault: "{{ (existing_vault_raw.stdout | from_yaml) or {} }}"
      when: vault_file_stat.stat.exists
      no_log: true

    - name: "VAULT | Initialize empty vault for first run"
      ansible.builtin.set_fact:
        existing_vault: {}
      when: not vault_file_stat.stat.exists

    - name: "VAULT | Identify new variables to add"
      ansible.builtin.set_fact:
        vars_to_add: "{{ vault_variables | rejectattr('name', 'in', existing_vault.keys() | list) | list }}"

    - name: "VAULT | Identify removed variables to clean up"
      ansible.builtin.set_fact:
        vars_to_remove: "{{ existing_vault.keys() | list | difference(vault_variables | map(attribute='name') | list) }}"

    - name: "VAULT | Determine if vault needs updating"
      ansible.builtin.set_fact:
        vault_needs_update: "{{ (vars_to_add | length > 0) or (vars_to_remove | length > 0) or (not vault_file_stat.stat.exists) }}"

    - name: "VAULT | Show vault sync status"
      ansible.builtin.debug:
        msg: >-
          {{ 'Vault is up to date — no changes needed.' if not vault_needs_update else
             'Vault update: adding [' ~ (vars_to_add | map(attribute='name') | join(', ') or 'none') ~
             '], removing [' ~ (vars_to_remove | join(', ') or 'none') ~ '].' }}

    - name: "VAULT | Prompt for new vault variable values"
      ansible.builtin.pause:
        prompt: "{{ item.prompt }}"
      register: new_var_values
      loop: "{{ vars_to_add }}"
      loop_control:
        label: "{{ item.name }}"
      when: vars_to_add | length > 0

    # Build a dict of newly prompted values so we can merge them with existing vars.
    - name: "VAULT | Collect new variable values into dict"
      ansible.builtin.set_fact:
        new_vars_dict: "{{ new_vars_dict | default({}) | combine({item.item.name: item.user_input}) }}"
      loop: "{{ new_var_values.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: vars_to_add | length > 0 and item.user_input is defined
      no_log: true

    # Merge existing vars (minus removed) + new vars into a single dict.
    # This dict is passed to templates/vault.yml.j2 which renders it as YAML.
    - name: "VAULT | Merge all vault variables"
      ansible.builtin.set_fact:
        vault_merged: "{{ (existing_vault | dict2items | rejectattr('key', 'in', vars_to_remove) | items2dict) | combine(new_vars_dict | default({})) }}"
      when: vault_needs_update
      no_log: true

    # If no variables remain, just remove the vault file entirely.
    - name: "VAULT | Remove vault file if no variables defined"
      ansible.builtin.file:
        path: "{{ vault_file }}"
        state: absent
      when: vault_needs_update and (vault_merged | default({}) | length == 0)

    # Render via a Jinja2 template file to avoid YAML scalar folding issues
    # that corrupt newlines when building multi-line content inline with set_fact.
    - name: "VAULT | Render vault content from template"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/vault.yml.j2"
        dest: "{{ vault_file }}.tmp"
        mode: "0600"
      when: vault_needs_update and (vault_merged | default({}) | length > 0)
      no_log: true

    - name: "VAULT | Remove existing vault before re-encrypting"
      ansible.builtin.file:
        path: "{{ vault_file }}"
        state: absent
      when: vault_needs_update and vault_file_stat.stat.exists and (vault_merged | default({}) | length > 0)

    # --encrypt-vault-id default: required because ansible.cfg also sets vault_password_file,
    # creating two "default" vault IDs. Without this flag, ansible-vault refuses to encrypt.
    - name: "VAULT | Encrypt vault file"
      ansible.builtin.command:
        cmd: "ansible-vault encrypt {{ vault_file }}.tmp --vault-password-file {{ vault_pass_file }} --encrypt-vault-id default --output {{ vault_file }}"
      when: vault_needs_update and (vault_merged | default({}) | length > 0)
      no_log: true

    - name: "VAULT | Remove temporary plaintext file"
      ansible.builtin.file:
        path: "{{ vault_file }}.tmp"
        state: absent
      when: vault_needs_update and (vault_merged | default({}) | length > 0)

    - name: "VAULT | Vault secrets file ready"
      ansible.builtin.debug:
        msg: "{{ 'Updated: ' ~ vault_file if vault_needs_update else 'Up to date: ' ~ vault_file }}"

    # =========================================================================
    # Done: Print summary and next steps
    # =========================================================================
    - name: "SETUP COMPLETE"
      ansible.builtin.debug:
        msg:
          - "Local environment is ready."
          - ""
          - "View vault contents:"
          - "  ansible-vault view {{ vault_file }} --vault-password-file {{ vault_pass_file }}"
          - ""
          - "Run playbooks, such as (NOTE: no --vault-password-file because it is already present in ansible.cfg!):"
          - "  ansible-playbook site.yml -i hosts -l lab-router --tags router"
