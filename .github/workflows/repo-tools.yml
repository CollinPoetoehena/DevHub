name: Repository tools

on:
  pull_request:
    paths:
      - tools/repo/**
      - .github/workflows/repo-tools.yml
      - .github/workflows/apm-sync.yml
      - .github/workflows/devhub-apm-sync.yml
  push:
    branches: [main]
    paths:
      - tools/repo/**
      - .github/workflows/repo-tools.yml
      - .github/workflows/apm-sync.yml
      - .github/workflows/devhub-apm-sync.yml

permissions:
  contents: read

concurrency:
  group: repo-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/repo/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Test
        run: terraform test

  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/repo/fleet
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Check inventory and templates
        run: uv run repo-fleet check
